<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img">
  <title>文明の自律的発展</title>
  <rect width="1280" height="360" fill="#0d1117"/>
  <text x="64" y="148" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Songti SC', serif" font-size="40" letter-spacing="0.18em" fill="#f0f6fc">文明の自律的発展</text>
  <rect x="64" y="176" width="48" height="1" fill="#f0f6fc"/>
  <text x="64" y="230" font-family="'Hiragino Sans', 'Helvetica Neue', sans-serif" font-size="15" fill="#9aa4b2">自律的発展とは、常時介入にも、法律や言語だけの監督にも、単一の権威にも依存せず、</text>
  <text x="64" y="256" font-family="'Hiragino Sans', 'Helvetica Neue', sans-serif" font-size="15" fill="#9aa4b2">系が観測・推論・行為・改善のループで秩序を維持し、進化し続けることです。</text>
</svg>
